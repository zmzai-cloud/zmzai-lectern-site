name: deploy

# Lectern 落地页：纯静态站点，push main 即 scp 到香港服务器 /var/www/lectern。
# Caddy 静态托管，传完即生效，无需 reload。
# 首次使用：仓库 Settings → Secrets and variables → Actions → New repository secret
# 名称 LECTERN_DEPLOY_KEY，值为专用部署钥匙的 ed25519 私钥（与 relay 的
# HK_DEPLOY_KEY 不是同一把：那把受限在 receive-deploy.sh，只服务 pm2 应用）。
# 未配置时部署步骤自动跳过并告警，不红。

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-lectern-site
  cancel-in-progress: false

env:
  HK_HOST: 149.88.84.189
  HK_USER: root
  DEPLOY_PATH: /var/www/lectern
  SITE_URL: https://lectern.zmzai.cloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 准备部署密钥
        id: key
        run: |
          if [ -z "${{ secrets.LECTERN_DEPLOY_KEY }}" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.LECTERN_DEPLOY_KEY，跳过部署（只跑校验）"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LECTERN_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HK_HOST" >> ~/.ssh/known_hosts
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: 污染自检（data-page-node-id 残留）
        run: ./scripts/guard-pollution.sh --check

      - name: 发版一致性门禁（版本号 / 直链 / 资源 / SEO 头）
        run: python3 scripts/check-release.py --live

      # 不用 scp：HK_DEPLOY_KEY 是受限钥匙，authorized_keys 里 command= 指向
      # 服务器上的 /opt/zmzai/scripts/receive-static.sh（静态站点接收器，
      # 只放行 html/css/js/png/svg/txt/json/xml/woff2，解包前自动备份）。
      # COPYFILE_DISABLE=1 防 macOS AppleDouble（._xxx）混进包——历史上泄漏过 5 个。
      - name: 打包并部署
        if: steps.key.outputs.ready == 'yes'
        run: |
          COPYFILE_DISABLE=1 tar -czf site.tgz \
            index.html features.html why.html roadmap.html \
            theme.css theme.js \
            favicon.png apple-touch-icon.png og-image.png logo.png \
            robots.txt sitemap.xml fonts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$HK_USER@$HK_HOST" < site.tgz

      - name: 冒烟
        if: steps.key.outputs.ready == 'yes'
        run: |
          for p in / /features.html /why.html /roadmap.html /theme.css /theme.js \
                   /favicon.png /apple-touch-icon.png /og-image.png /logo.png \
                   /robots.txt /sitemap.xml /fonts/misans-regular.woff2; do
            code=$(curl -s --compressed -o /dev/null -w '%{http_code}' "$SITE_URL$p")
            echo "$p -> $code"
            if [ "$code" != "200" ]; then echo "::error::$p 返回 $code"; exit 1; fi
          done
          # 压缩与缓存头必须生效（曾经整站没有 encode，58KB CSS 原样传）
          curl -sI -H 'Accept-Encoding: gzip' "$SITE_URL/theme.css" | grep -qi 'content-encoding: gzip' \
            || { echo "::error::theme.css 未启用 gzip"; exit 1; }
          curl -sI "$SITE_URL/theme.css" | grep -qi 'cache-control:.*immutable' \
            || { echo "::error::theme.css 缺 immutable 缓存头"; exit 1; }
